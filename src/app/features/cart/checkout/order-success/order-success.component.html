<div class="max-w-[800px] mx-auto px-5 py-20 text-center animate-in fade-in duration-500 delay-150">
    <div class="bg-white rounded-[32px] shadow-[0_20px_80px_rgba(0,0,0,0.08)] p-12 border border-gray-100">
        <div
            class="w-20 h-20 rounded-full bg-green-50 border-[3px] border-green-200 flex items-center justify-center mx-auto mb-6">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-9 h-9 text-green-600" fill="currentColor"
                viewBox="0 0 20 20">
                <path fill-rule="evenodd"
                    d="M16.704 4.153a.75.75 0 0 1 .143 1.052l-8 10.5a.75.75 0 0 1-1.127.075l-4.5-4.5a.75.75 0 0 1 1.06-1.06l3.894 3.893 7.48-9.817a.75.75 0 0 1 1.05-.143Z"
                    clip-rule="evenodd" />
            </svg>
        </div>
        <h2 class="font-black text-[2.2rem] text-[#1a1a2e] mb-2">Order Placed!</h2>
        <p class="text-[#1a1a2e]/90 text-[1.1rem] leading-relaxed max-w-[480px] mx-auto">Thank you for your
            purchase.<br />We've received your order and are processing it right now.</p>

        @if (orderId()) {
        <span
            class="inline-block bg-gray-100 rounded-lg px-6 py-2.5 text-[0.9rem] font-bold tracking-[0.05em] text-[#1a1a2e] mt-8 uppercase">
            Order #{{ orderId() }}
        </span>
        }

        <div class="mt-10 flex flex-col sm:flex-row items-center justify-center gap-4">
            <a routerLink="/products"
                class="w-full sm:w-auto inline-flex items-center justify-center gap-2 py-4 px-10 bg-brand-primary text-white rounded-[16px] text-[1rem] font-bold shadow-[0_4px_16px_rgba(26,26,46,0.25)] hover:-translate-y-0.5 hover:opacity-90 transition-all duration-200">
                Continue Shopping
            </a>
            <a routerLink="/orders"
                class="w-full sm:w-auto inline-flex items-center justify-center gap-2 py-4 px-10 bg-white text-[#1a1a2e] border-[1.5px] border-gray-200 rounded-[16px] text-[1rem] font-bold hover:bg-gray-50 transition-all duration-200">
                Track My Order
            </a>
        </div>
    </div>

    <div class="mt-10 flex items-center justify-center gap-3 text-gray-400">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 00-2 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
        <span class="text-xs font-bold uppercase tracking-widest">Transaction Secured & Encrypted</span>
    </div>
</div>
