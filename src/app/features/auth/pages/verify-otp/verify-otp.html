<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg">
    <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Verify Your Email</h2>
    <p class="text-center text-gray-500 text-sm mb-6">
      Enter the OTP sent to your email address
    </p>

    <form [formGroup]="form" (ngSubmit)="submit()" class="space-y-5">
      <div>
        <input
          class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none placeholder:text-gray-500"
          placeholder="Enter OTP"
          formControlName="otp"
        />
        <div *ngIf="form.get('otp')?.touched">
          <small *ngIf="form.get('otp')?.errors?.['required']" class="text-red-500 text-sm mt-1">
            OTP is required
          </small>
        </div>
      </div>

      <button
        type="submit"
        [disabled]="form.invalid"
        class="w-full bg-brand-accent text-white py-2 rounded-lg hover:bg-brand-accent/90 transition disabled:bg-gray-400 disabled:cursor-not-allowed cursor-pointer"
      >
        Verify
      </button>
    </form>

    <div *ngIf="email" class="mt-4 text-center text-sm text-gray-600">
      Didn't receive the code?
      <button
        type="button"
        (click)="resendOtp()"
        [disabled]="resendLoading()"
        class="text-brand-accent hover:underline disabled:opacity-50 disabled:cursor-not-allowed cursor-pointer ml-1"
      >
        {{ resendLoading() ? 'Sending...' : 'Resend OTP' }}
      </button>
    </div>

    <div class="mt-4 text-center text-sm">
      <a routerLink="/auth/login" class="text-brand-accent hover:underline">Back to Login</a>
    </div>
  </div>
</div>
