<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg animate-fade-in">
    <h2 class="text-2xl font-bold text-center text-brand-accent mb-6">Verify Your Email</h2>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <input
        class="input w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none placeholder:text-gray-500"
        placeholder="Enter OTP"
        formControlName="otp"
      />
      <div *ngIf="form.get('otp')?.touched">
        <small *ngIf="form.get('otp')?.errors?.['required']" class="text-red-500 text-sm mt-1">
          OTP is required
        </small>
      </div>

      <button
        type="submit"
        class="btn w-1/2 block mt-4 mx-auto bg-brand-accent text-white py-2 rounded-lg hover:bg-brand-accent/90 transition disabled:bg-gray-400 disabled:cursor-not-allowed cursor-pointer"
      >
        Verify
      </button>
    </form>

    <p class="text-center text-sm text-gray-600 mt-4">
      Already have an account?
      <a routerLink="/auth/login" class="text-brand-accent hover:underline">Login</a>
    </p>
  </div>
</div>
