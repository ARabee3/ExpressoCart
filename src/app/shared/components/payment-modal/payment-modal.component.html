@if (clientSecret) {
<!-- Modal Backdrop -->
<div
    class="fixed inset-0 z-[100] flex items-center justify-center bg-brand-primary/60 backdrop-blur-sm animate-in fade-in duration-300 p-4">
    <!-- Modal Content -->
    <div
        class="bg-brand-surface rounded-2xl shadow-2xl w-full max-w-[500px] p-7 animate-in zoom-in-95 duration-300 relative flex flex-col max-h-[90vh]">

        <!-- Header -->
        <div class="flex items-center justify-between mb-6 pb-4 border-b border-brand-primary/5">
            <h3 class="text-[1.2rem] font-bold text-brand-primary flex items-center gap-2 m-0 leading-none">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-brand-primary" fill="currentColor"
                    viewBox="0 0 20 20">
                    <path d="M4 4a2 2 0 00-2 2v1h16V6a2 2 0 00-2-2H4z" />
                    <path fill-rule="evenodd"
                        d="M18 9H2v5a2 2 0 002 2h12a2 2 0 002-2V9zM5 12a1 1 0 112 0 1 1 0 01-2 0zm7-1a1 1 0 100 2h3a1 1 0 100-2h-3z"
                        clip-rule="evenodd" />
                </svg>
                Payment Details
            </h3>

            <!-- Close Button -->
            <button type="button" (click)="close()"
                class="text-brand-primary/40 hover:text-red-500 hover:bg-red-50 p-2 rounded-full transition-all duration-200">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>
        </div>

        <!-- Scrollable Content Area -->
        <div class="flex-1 overflow-y-auto mb-6 custom-scrollbar">
            <div id="payment-element" class="min-h-[200px] p-1">
                <!-- Stripe mounts here -->
            </div>
        </div>

        @if (stripeError()) {
        <div
            class="bg-red-50 border border-red-100 text-red-600 p-4 rounded-[14px] text-[0.875rem] font-medium mb-6 flex items-start gap-3">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 shrink-0 mt-0.5" fill="none" viewBox="0 0 24 24"
                stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
            <span>{{ stripeError() }}</span>
        </div>
        }

        <button (click)="confirmPayment()" [disabled]="isConfirmingPayment()"
            class="w-full py-4.5 bg-brand-primary text-white rounded-[14px] font-bold text-[1.1rem] shadow-[0_4px_16px_rgba(26,26,46,0.25)] hover:opacity-95 active:scale-[0.98] disabled:opacity-50 disabled:pointer-events-none transition-all duration-200 flex items-center justify-center gap-2 mt-auto">
            @if (isConfirmingPayment()) {
            <svg class="animate-spin h-5 w-5 text-white" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor"
                    d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z">
                </path>
            </svg>
            Processing...
            } @else {
            Pay & Confirm Order
            }
        </button>
    </div>
</div>
}
