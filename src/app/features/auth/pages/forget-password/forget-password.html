<div class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white p-8 rounded-2xl shadow-lg">
    @if (!showResetForm()) {
      <h2 class="text-2xl font-bold text-center text-brand-accent mb-6">Forgot Password</h2>
      <form [formGroup]="emailForm" (ngSubmit)="sendOtp()">
        <div>
          <input
            type="email"
            placeholder="Enter your email"
            formControlName="email"
            class="w-full px-4 py-2 mb-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none placeholder:text-gray-500"
          />
          <div *ngIf="emailForm.get('email')?.touched">
            <small
              class="error"
              *ngIf="emailForm.get('email')?.errors?.['required']"
              class="text-red-500 text-sm mt-1"
            >
              Email is required
            </small>
            <small
              class="error"
              *ngIf="emailForm.get('email')?.errors?.['email']"
              class="text-red-500 text-sm mt-1"
            >
              Invalid email format
            </small>
          </div>
        </div>
        <button
          type="submit"
          [disabled]="loading()"
          class="w-full bg-brand-accent text-white py-2 rounded-lg hover:bg-brand-accent/90 transition disabled:bg-gray-400 disabled:cursor-not-allowed"
        >
          {{ loading() ? 'Sending...' : 'Send OTP' }}
        </button>
      </form>
    } @else {
      <h2 class="text-2xl font-bold text-center text-brand-accent mb-6">Reset Your Password</h2>
      <form [formGroup]="resetForm" (ngSubmit)="submitReset()">
        <input
          type="text"
          class="input w-full px-4 py-2 mb-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none placeholder:text-gray-500"
          placeholder="Enter OTP"
          formControlName="otp"
        />
        <div *ngIf="resetForm.get('otp')?.touched">
          <small
            class="error"
            *ngIf="resetForm.get('otp')?.errors?.['required']"
            class="text-red-500 text-sm mt-1"
          >
            OTP is required
          </small>
        </div>
        <input
          type="password"
          placeholder="Enter New Password"
          formControlName="newPassword"
          class="w-full px-4 py-2 mb-4 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500 outline-none placeholder:text-gray-500"
        />

        <div *ngIf="resetForm.get('newPassword')?.touched">
          <small
            class="error"
            *ngIf="resetForm.get('newPassword')?.errors?.['required']"
            class="text-red-500 text-sm mt-1"
          >
            Password is required
          </small>
          <small
            class="error"
            *ngIf="resetForm.get('newPassword')?.errors?.['pattern']"
            class="text-red-500 text-sm mt-1"
          >
            Must contain upper, lower, number, special char
          </small>
        </div>
        <button
          type="submit"
          [disabled]="loading()"
          class="w-full bg-brand-accent text-white py-2 rounded-lg hover:bg-brand-accent/90 transition disabled:bg-gray-400 disabled:cursor-not-allowed"
        >
          Reset Password
        </button>
      </form>
    }
  </div>
</div>
