<div class="flex h-screen bg-gray-100 overflow-hidden">
  <!-- Mobile Backdrop -->
  @if (sidebarOpen()) {
    <div class="fixed inset-0 bg-black/50 z-40 md:hidden" (click)="toggleSidebar()"></div>
  }

  <!-- Sidebar -->
  <aside
    class="fixed inset-y-0 left-0 z-50 w-64 bg-black text-white flex flex-col shrink-0 transition-transform duration-300 md:static md:translate-x-0"
    [class.-translate-x-full]="!sidebarOpen()"
    [class.translate-x-0]="sidebarOpen()"
  >
    <!-- Brand -->
    <div class="px-6 py-5 border-b border-white/10 flex items-center justify-between">
      <div>
        <h1 class="text-xl font-black tracking-tighter italic">EXPRESSO.</h1>
        <p class="text-xs text-gray-400 mt-0.5">Seller Panel</p>
      </div>
      <!-- Close button (mobile only) -->
      <button (click)="toggleSidebar()" class="md:hidden text-gray-400 hover:text-white">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="2"
          stroke="currentColor"
          class="size-5"
        >
          <path stroke-linecap="round" stroke-linejoin="round" d="M6 18 18 6M6 6l12 12" />
        </svg>
      </button>
    </div>

    <!-- Store Info -->
    <div class="px-6 py-4 border-b border-white/10 bg-white/5">
      <div class="flex items-center gap-3">
        <div
          class="w-9 h-9 rounded-lg bg-brand-accent flex items-center justify-center text-white text-sm font-bold shrink-0"
        >
          🏪
        </div>
        <div class="min-w-0">
          <p class="text-sm font-bold text-white truncate">{{ storeName() }}</p>
          <p class="text-[11px] text-gray-400 truncate">{{ sellerName() }}</p>
        </div>
      </div>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-4 py-6 flex flex-col gap-1">
      <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest px-3 mb-2">Main</p>

      <a
        routerLink="dashboard"
        routerLinkActive="bg-white/10 text-white"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="closeSidebarOnMobile()"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-white/10 hover:text-white transition-colors"
      >
        <span>📊</span> Dashboard
      </a>

      <a
        routerLink="products"
        routerLinkActive="bg-white/10 text-white"
        (click)="closeSidebarOnMobile()"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-white/10 hover:text-white transition-colors"
      >
        <span>📦</span> My Products
      </a>

      <a
        routerLink="profile"
        routerLinkActive="bg-white/10 text-white"
        (click)="closeSidebarOnMobile()"
        class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-white/10 hover:text-white transition-colors"
      >
        <span>👤</span> Profile
      </a>

      <div class="mt-4">
        <p class="text-[10px] font-bold text-gray-500 uppercase tracking-widest px-3 mb-2">Store</p>
        <a
          routerLink="/products"
          (click)="closeSidebarOnMobile()"
          class="flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-white/10 hover:text-white transition-colors"
        >
          <span>🛒</span> View Marketplace
        </a>
      </div>
    </nav>

    <!-- Bottom: Logout -->
    <div class="px-4 py-4 border-t border-white/10">
      <button
        (click)="logout()"
        class="w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm text-gray-400 hover:bg-red-500/10 hover:text-red-400 transition-colors"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          fill="none"
          viewBox="0 0 24 24"
          stroke-width="1.5"
          stroke="currentColor"
          class="size-4"
        >
          <path
            stroke-linecap="round"
            stroke-linejoin="round"
            d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15M12 9l3 3m0 0-3 3m3-3H2.25"
          />
        </svg>
        Logout
      </button>
    </div>
  </aside>

  <!-- Main Content -->
  <div class="flex-1 flex flex-col overflow-hidden">
    <!-- Top Header -->
    <header
      class="h-14 bg-white border-b border-gray-200 flex items-center justify-between px-4 sm:px-6 shrink-0"
    >
      <div class="flex items-center gap-3">
        <!-- Hamburger (mobile only) -->
        <button (click)="toggleSidebar()" class="md:hidden text-gray-600 hover:text-black">
          <svg
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="2"
            stroke="currentColor"
            class="size-5"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
            />
          </svg>
        </button>
        <div class="text-sm text-gray-500">
          Welcome back, <span class="font-semibold text-gray-800">{{ sellerName() }}</span>
        </div>
      </div>
      <div class="text-xs bg-emerald-50 text-emerald-700 px-3 py-1 rounded-full font-semibold">
        ✓ Active Seller
      </div>
    </header>

    <!-- Page Content -->
    <main class="flex-1 overflow-y-auto p-4 sm:p-6">
      <router-outlet />
    </main>
  </div>
</div>
