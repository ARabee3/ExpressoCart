<div class="max-w-[1100px] mx-auto px-5 py-10">

    <!-- Page Header -->
    <div class="mb-8 font-primary">
        <h1 class="font-black text-[2.5rem] text-[#1a1a2e] uppercase tracking-tighter">Checkout</h1>
        <p class="text-[#1a1a2e]/40 text-[0.9rem] mt-1 font-medium">Complete your order in a few easy steps</p>
    </div>

    <!-- stepper -->
    <app-checkout-stepper [currentStep]="currentStep"></app-checkout-stepper>

    <!-- layout -->
    <div class="grid grid-cols-1 lg:grid-cols-[1fr_360px] gap-8 items-start mt-10">

        <!-- left side -->
        <div class="space-y-6">
            <!-- step 1: address -->
            @if (currentStep === 1) {
            <app-checkout-shipping (nextStep)="onShippingNext($event)"></app-checkout-shipping>
            }

            <!-- step 2: payment selection -->
            @if (currentStep === 2) {
            <app-checkout-payment (nextStep)="onPaymentNext($event)" (backStep)="goStep(1)"></app-checkout-payment>
            }

            <!-- step 3: review & integrated pay -->
            @if (currentStep === 3) {
            <app-checkout-review [resolvedAddress]="resolvedAddressFormatted" [selectedPayment]="selectedPayment"
                [isPlacingOrder]="isPlacingOrder()" [clientSecret]="activeClientSecret()" [orderId]="orderId"
                (backStep)="goStep(2)" (placeOrder)="placeOrder()" (paymentSuccess)="handleSuccess($event)"
                (paymentError)="handleError($event)" (cancelPayment)="activeClientSecret.set(null)">
            </app-checkout-review>
            }
        </div>

        <!-- right side bar -> order summary -->
        <div class="sticky top-6">
            <app-checkout-summary></app-checkout-summary>
        </div>

    </div>
</div>
